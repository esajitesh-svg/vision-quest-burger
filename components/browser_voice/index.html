<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{margin:0;background:transparent;color:#c5d9e3}
.shell{padding:8px 10px;border:1px solid #1c5665;border-left:3px solid #32eaff;background:linear-gradient(110deg,#03080c,#071820 70%,#071019)}
.kicker{font:700 11px monospace;letter-spacing:.18em;color:#50e7f8;margin-bottom:7px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button{border:1px solid #287181;border-radius:4px;padding:10px 14px;min-height:39px;font-weight:800;letter-spacing:.04em;cursor:pointer}
#start{background:#00cfe8;color:#031015}
#stop{background:#0b1b25;color:#c5d9e3}
#test,#replay,#speak{background:#09212a;color:#70ecff}
button:disabled{opacity:.38;cursor:not-allowed}
#status{font:12px/1.5 system-ui;color:#79bdc9;flex:1;min-width:170px}
#heard{font-size:12px;line-height:1.5;color:#a8c5d3;margin-top:7px;min-height:17px;overflow-wrap:anywhere}
.note{font-size:11px;color:#678d9b;margin-top:5px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4a6871;margin-right:6px}
.pulse.live{background:#51f3bb;box-shadow:0 0 8px #51f3bb}
</style>
</head>
<body>
<div class="shell">
  <div class="kicker">SMRITI // LIVE VOICE LINK</div>
  <div class="row">
    <button id="start" type="button">🎙 ACTIVATE LISTENING</button>
    <button id="test" type="button">🔊 TEST VOICE</button>
    <button id="replay" type="button" disabled>↻ REPLAY LAST</button>
    <button id="speak" type="button" disabled>🗣 SPEAK ANSWER</button>
    <button id="stop" type="button">■ STOP</button>
    <div id="status" role="status" aria-live="polite"><span id="pulse" class="pulse"></span>Voice link idle.</div>
  </div>
  <div id="heard"></div>
  <div class="note">Browser speech recognition is used for faster turn capture. Mic stays active until STOP; speaking pauses listening to prevent echo.</div>
</div>
<script>
(() => {
  const startButton = document.getElementById("start");
  const stopButton = document.getElementById("stop");
  const testButton = document.getElementById("test");
  const replayButton = document.getElementById("replay");
  const speakButton = document.getElementById("speak");
  const statusNode = document.getElementById("status");
  const pulseNode = document.getElementById("pulse");
  const heardNode = document.getElementById("heard");
  const speech = window.speechSynthesis;
  let args = {};
  let recognition = null;
  let desiredListening = false;
  let speaking = false;
  let currentSpeechKind = "";
  let speechGeneration = 0;
  let recognitionRunning = false;
  let awaitingReply = false;
  let previouslyBusy = false;
  let userStopped = false;
  let initialized = false;
  let lastSpeechSequence = 0;
  let lastResultIndex = 0;
  let startTimer = null;
  let speechStartWatchdog = null;
  let currentSpeechStarted = false;
  let lastSpokenText = "";
  let lastSpokenKind = "reply";

  function setStatus(message, live = false) {
    pulseNode.className = live ? "pulse live" : "pulse";
    statusNode.lastChild.textContent = message;
  }

  function sendValue(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      dataType: "json",
      value
    }, "*");
  }

  function scheduleRestart(delay = 220) {
    if (!desiredListening || speaking || awaitingReply || !args.enabled || args.busy) return;
    clearTimeout(startTimer);
    startTimer = setTimeout(startRecognition, delay);
  }

  function createRecognition() {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      setStatus("Speech recognition is not supported here. Use current Chrome or Edge.");
      return null;
    }
    const rec = new Recognition();
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.lang = args.language || "en-IN";
    rec.onstart = () => {
      recognitionRunning = true;
      lastResultIndex = 0;
      setStatus("Listening — speak naturally, then pause briefly.", true);
    };
    rec.onresult = event => {
      let partial = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        const phrase = result && result[0] ? String(result[0].transcript || "").trim() : "";
        if (!phrase) continue;
        if (result.isFinal) {
          // Accept one final utterance, then hold the mic until the answer is spoken.
          awaitingReply = true;
          const eventId = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
          heardNode.textContent = "Heard: " + phrase;
          setStatus("Heard you — preparing a reply…", true);
          sendValue({event: "transcript", event_id: eventId, transcript: phrase});
          try { rec.stop(); } catch (_) {}
          return;
        } else {
          partial = phrase;
        }
      }
      if (partial) {
        heardNode.textContent = "Hearing: " + partial;
        setStatus("Listening…", true);
      }
    };
    rec.onerror = event => {
      const error = String(event.error || "unknown");
      if (error === "not-allowed" || error === "service-not-allowed") {
        desiredListening = false;
        setStatus("Microphone permission denied. Allow it in the browser address bar, then activate again.");
      } else if (error === "no-speech") {
        setStatus("Still listening — say a short sentence.", desiredListening);
      } else if (error === "network") {
        setStatus("Browser speech service has a network issue. Check connection and retry.");
      } else if (error !== "aborted") {
        setStatus("Speech error: " + error + ". Press Activate to retry.");
      }
    };
    rec.onend = () => {
      recognitionRunning = false;
      if (desiredListening && !speaking && !awaitingReply && args.enabled && !args.busy) {
        scheduleRestart(260);
      } else if (desiredListening && args.busy) {
        setStatus("Smriti is thinking — listening will resume after the reply.", true);
      } else if (!desiredListening) {
        awaitingReply = false;
        startButton.disabled = !args.enabled;
        startButton.textContent = "🎙 ACTIVATE LISTENING";
        setStatus("Voice link stopped.");
      }
    };
    return rec;
  }

  function startRecognition() {
    if (!desiredListening || speaking || awaitingReply || !args.enabled || args.busy || recognitionRunning) return;
    if (!recognition) recognition = createRecognition();
    if (!recognition) return;
    try {
      recognition.lang = args.language || "en-IN";
      recognition.start();
    } catch (error) {
      // Chrome can briefly report InvalidStateError while a previous recognizer ends.
      scheduleRestart(500);
    }
  }

  function startListening() {
    if (!args.enabled) {
      setStatus("Enable LIVE JARVIS in the app first.");
      return;
    }
    userStopped = false;
    awaitingReply = false;
    desiredListening = true;
    startButton.disabled = true;
    startButton.textContent = "● LISTENING";
    if (recognition) {
      try { recognition.stop(); } catch (_) {}
    }
    recognition = null;
    recognitionRunning = false;
    setStatus("Requesting microphone permission…");
    startRecognition();
  }

  function stopListening() {
    desiredListening = false;
    awaitingReply = false;
    userStopped = true;
    clearTimeout(startTimer);
    if (recognition) {
      try { recognition.stop(); } catch (_) {}
    }
    speechGeneration += 1;
    if (speech) speech.cancel();
    currentSpeechKind = "";
    speaking = false;
    startButton.disabled = !args.enabled;
    startButton.textContent = "🎙 ACTIVATE LISTENING";
    setStatus("Voice link stopped.");
  }

  function speakUpdate(text, sequence, kind = "reply", retryAttempt = 0) {
    lastSpokenText = String(text || "");
    lastSpokenKind = String(kind || "reply");
    replayButton.disabled = !lastSpokenText;
    if (userStopped || !text || !speech || typeof window.SpeechSynthesisUtterance === "undefined") return;
    const requestedKind = String(kind || "reply");
    // Never cancel an utterance just because another camera description arrived.
    // A direct reply is allowed to interrupt narration and take priority.
    if (speaking && requestedKind !== "reply") return;
    const generation = ++speechGeneration;
    speaking = true;
    currentSpeechKind = requestedKind;
    currentSpeechStarted = false;
    clearTimeout(speechStartWatchdog);
    if (recognition && recognitionRunning) {
      try { recognition.stop(); } catch (_) {}
    }
    // Some Chromium builds leave speechSynthesis paused after cancel(). Explicitly
    // resume it before queueing the next utterance.
    try {
      speech.cancel();
      speech.resume();
    } catch (error) {
      setStatus("Could not reset browser speech: " + String(error && error.message || error));
    }
    const utterance = new SpeechSynthesisUtterance(String(text));
    const lang = args.language || "en-IN";
    utterance.lang = lang;
    utterance.rate = Math.max(0.65, Math.min(1.25, Number(args.rate || 0.92)));
    utterance.pitch = 1.0;
    const voices = speech.getVoices();
    const exact = voices.find(v => v.lang && v.lang.toLowerCase() === lang.toLowerCase());
    const sameLanguage = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.split("-")[0].toLowerCase()));
    if (exact || sameLanguage) utterance.voice = exact || sameLanguage;
    utterance.onstart = () => {
      if (generation !== speechGeneration) return;
      currentSpeechStarted = true;
      clearTimeout(speechStartWatchdog);
      setStatus("Smriti is speaking. Listening resumes afterwards.", true);
    };
    utterance.onend = () => {
      if (generation !== speechGeneration) return;
      clearTimeout(speechStartWatchdog);
      speaking = false;
      currentSpeechKind = "";
      currentSpeechStarted = false;
      awaitingReply = false;
      if (desiredListening && args.enabled) {
        setStatus("Reply finished — listening again.", true);
        startButton.disabled = true;
        startButton.textContent = "● LISTENING";
        scheduleRestart(250);
      } else {
        setStatus("Reply finished.");
      }
    };
    utterance.onerror = event => {
      if (generation !== speechGeneration) return;
      clearTimeout(speechStartWatchdog);
      const reason = String(event && event.error || "unknown");
      // Browser speech can occasionally drop the first utterance after cancel/resume.
      // Retry one AI reply automatically before asking the user to use manual replay.
      if (requestedKind === "reply" && retryAttempt < 1) {
        setStatus("Speech playback failed (" + reason + "). Retrying the answer once…", true);
        const failedGeneration = generation;
        setTimeout(() => {
          if (failedGeneration === speechGeneration) {
            speakUpdate(text, sequence, requestedKind, retryAttempt + 1);
          }
        }, 300);
        return;
      }
      speaking = false;
      currentSpeechKind = "";
      currentSpeechStarted = false;
      awaitingReply = false;
      setStatus("Speech playback failed (" + reason + "). Click REPLAY LAST to retry.");
      if (desiredListening) scheduleRestart(250);
    };
    const speechStartTimeout = requestedKind === "reply" ? 8000 : 6000;
    speechStartWatchdog = setTimeout(() => {
      if (generation !== speechGeneration || currentSpeechStarted || !speaking) return;
      if (requestedKind === "reply" && retryAttempt < 1) {
        setStatus("Automatic speech did not start. Retrying the answer once…", true);
        const failedGeneration = generation;
        setTimeout(() => {
          if (failedGeneration === speechGeneration) {
            speakUpdate(text, sequence, requestedKind, retryAttempt + 1);
          }
        }, 300);
        return;
      }
      speaking = false;
      currentSpeechKind = "";
      awaitingReply = false;
      setStatus("The browser did not start automatic speech. Click REPLAY LAST to speak the saved reply.");
      if (desiredListening) scheduleRestart(250);
    }, speechStartTimeout);
    try {
      speech.speak(utterance);
      // Older browsers can be left paused even after resume() called above.
      if (speech.paused) speech.resume();
    } catch (error) {
      clearTimeout(speechStartWatchdog);
      if (generation !== speechGeneration) return;
      speaking = false;
      currentSpeechKind = "";
      currentSpeechStarted = false;
      setStatus("Could not play speech: " + String(error && error.message || error) + ". Click REPLAY LAST.");
    }
  }

  testButton.addEventListener("click", () => {
    // Keep the browser's speech action within a direct click gesture so autoplay
    // restrictions cannot silently prevent the first speech.
    userStopped = false;
    speechGeneration += 1;
    speaking = false;
    if (!speech || typeof window.SpeechSynthesisUtterance === "undefined") {
      setStatus("Text-to-speech is unavailable in this browser. Try current Chrome or Edge.");
      return;
    }
    try {
      try { speech.cancel(); speech.resume(); } catch (_) {}
      const test = new SpeechSynthesisUtterance("Smriti voice test. If you can hear this, speaker output is working.");
      test.lang = args.language || "en-IN";
      test.rate = Math.max(0.65, Math.min(1.25, Number(args.rate || 0.92)));
      test.pitch = 1.0;
      const voices = speech.getVoices();
      const langRoot = test.lang.split("-")[0].toLowerCase();
      const matched = voices.find(v => v.lang && v.lang.toLowerCase() === test.lang.toLowerCase())
        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langRoot));
      if (matched) test.voice = matched;
      test.onstart = () => setStatus("TEST VOICE IS SPEAKING. If silent, check device volume/output.");
      test.onend = () => setStatus("Test finished. " + (desiredListening ? "Live listening remains enabled." : "Press ACTIVATE LISTENING to talk."));
      test.onerror = event => setStatus("Text-to-speech error: " + String(event.error || "unknown") + ". Check browser audio settings.");
      lastSpokenText = "Smriti voice test. If you can hear this, speaker output is working.";
      lastSpokenKind = "test";
      replayButton.disabled = false;
      speech.speak(test);
      setStatus("Sending test speech to the browser voice engine…");
    } catch (error) {
      setStatus("Could not start test speech: " + String(error && error.message || error));
    }
  });

  replayButton.addEventListener("click", () => {
    if (!lastSpokenText) {
      setStatus("No reply has arrived to replay yet.");
      return;
    }
    userStopped = false;
    speakUpdate(lastSpokenText, Date.now(), lastSpokenKind || "reply");
  });

  // This button reads the latest answer directly from the latest Streamlit render.
  // It provides a genuine user click path even if automatic speech was blocked or delayed.
  speakButton.addEventListener("click", () => {
    const latestAnswer = String(args.speech_text || "").trim();
    if (!latestAnswer) {
      setStatus("No AI answer text has reached the voice panel yet.");
      return;
    }
    userStopped = false;
    awaitingReply = false;
    setStatus("Manual speech requested for the latest app answer…", true);
    speakUpdate(latestAnswer, Number(args.speech_sequence || Date.now()), "reply");
  });

  startButton.addEventListener("click", startListening);
  stopButton.addEventListener("click", stopListening);

  window.addEventListener("message", event => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    args = event.data.args || {};
    speakButton.disabled = !String(args.speech_text || "").trim();
    startButton.disabled = !args.enabled || desiredListening;
    startButton.textContent = desiredListening ? "● LISTENING" : "🎙 ACTIVATE LISTENING";
    stopButton.disabled = !desiredListening && !speaking;
    if (!args.enabled && desiredListening) stopListening();
    if (args.busy && desiredListening && !speaking && recognition && recognitionRunning) {
      setStatus("Smriti is thinking — pausing the mic to avoid capturing unrelated speech.", true);
      try { recognition.stop(); } catch (_) {}
    }
    const wasBusy = previouslyBusy;
    previouslyBusy = Boolean(args.busy);
    if (!initialized) {
      initialized = true;
      // Start from zero so a reply queued before the iframe mounted is not lost.
      // The common sequence check below consumes it immediately on this render.
      lastSpeechSequence = 0;
      setStatus(args.enabled ? "Ready. Press Activate to grant mic access and begin." : "Enable LIVE JARVIS and start the camera first.");
    }

    const sequence = Number(args.speech_sequence || 0);
    if (sequence > lastSpeechSequence && args.speech_text) {
      lastSpeechSequence = sequence;
      speakUpdate(args.speech_text, sequence, args.speech_kind || "reply");
    }

    // Recover listening if the model errors out before producing a reply.
    if (awaitingReply && !args.busy && (wasBusy || args.voice_error)) {
      awaitingReply = false;
      setStatus(args.voice_error ? "Reply failed — listening again. Check the notice in the app." : "Ready for your next question.", true);
    }
    if (args.enabled && !desiredListening && !speaking && !userStopped) {
      setStatus("Ready. Press Activate to begin listening.");
    }
    if (userStopped) setStatus("Voice link stopped.");
    if (desiredListening && args.enabled && !args.busy && !speaking && !awaitingReply && !recognitionRunning) {
      scheduleRestart(250);
    }
    if (args.last_transcript) heardNode.textContent = "Last heard: " + String(args.last_transcript).slice(0, 300);
    if (!speech || typeof window.SpeechSynthesisUtterance === "undefined") {
      setStatus("No browser text-to-speech support detected. Use current Chrome or Edge.");
      testButton.disabled = true;
    }
    if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
      if (desiredListening) {
        desiredListening = false;
        startButton.disabled = !args.enabled;
        setStatus("Speech recognition unsupported. TEST VOICE still works; use Chrome/Edge for listening.");
      }
    }
    window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 190}, "*");
  });

  window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1}, "*");
})();
</script>
</body>
</html>
