name: VisionQuest Python checks

on:
  push:
    branches: [main, simple-smriti-ui]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-live-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip pytest requests pillow numpy opencv-contrib-python-headless==4.14.0.94 "streamlit>=1.51,<2.0" streamlit-webrtc==0.70.1 "psycopg[binary]>=3.2,<4"

      - name: Validate browser voice component JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("components/browser_voice/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/smriti-browser-voice.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/smriti-browser-voice.js
          node tests/browser_voice_smoke.cjs components/browser_voice/index.html

      - name: Compile all Python source
        run: python -m compileall -q app.py simple_app.py core tests

      - name: Check runtime imports
        run: python -c "import streamlit, streamlit_webrtc, av, cv2; assert hasattr(cv2, 'face') and hasattr(cv2.face, 'LBPHFaceRecognizer_create'); from streamlit_webrtc import VideoHTMLAttributes; import core.cloud_db, core.cloud_vision, core.cloud_detection, core.realtime_detector, core.live_report, core.cloud_cv, core.cloud_live, core.voice, core.cloud_voice, core.live_voice, core.demo_mode, core.face_recognition; print('runtime imports passed')"

      - name: Test live OpenCV processing, recording, and vision modes
        run: python -m pytest -q tests
