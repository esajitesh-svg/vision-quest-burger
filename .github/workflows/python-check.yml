name: VisionQuest Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-live-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip pytest requests pillow numpy opencv-python-headless==4.14.0.94 "streamlit>=1.51,<2.0" streamlit-webrtc==0.70.1

      - name: Compile all Python source
        run: python -m compileall -q app.py core tests

      - name: Check runtime imports
        run: python -c "import streamlit, streamlit_webrtc, av, cv2; import core.cloud_db, core.cloud_vision, core.cloud_cv, core.cloud_live, core.voice; print('runtime imports passed')"

      - name: Test live OpenCV processing, recording, and vision modes
        run: python -m pytest -q tests
